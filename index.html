<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuiz Matematik Pantas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .kad {
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1 { font-size: 1.5rem; color: #312e81; margin-bottom: 6px; }
    .sub { color: #64748b; margin-bottom: 24px; }
    .soalan { font-size: 2.6rem; font-weight: bold; color: #0f172a; margin-bottom: 20px; }
    input {
      width: 100%;
      font-size: 1.5rem;
      padding: 12px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 14px;
    }
    input:focus { outline: none; border-color: #4f46e5; }
    button {
      width: 100%;
      font-size: 1.1rem;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #4f46e5;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }
    button:active { transform: scale(0.98); }
    .mesej { min-height: 28px; margin-top: 16px; font-size: 1.1rem; font-weight: bold; }
    .betul { color: #16a34a; }
    .salah { color: #dc2626; }
    .markah { margin-top: 18px; color: #475569; }
  </style>
</head>
<body>
  <div class="kad">
    <h1>🧮 Kuiz Matematik Pantas</h1>
    <p class="sub">Jawab seberapa banyak yang boleh!</p>

    <div class="soalan" id="soalan">0 + 0</div>
    <input type="number" id="jawapan" placeholder="Jawapan" autofocus>
    <button onclick="semak()">Semak</button>

    <div class="mesej" id="mesej"></div>
    <div class="markah">Markah: <b id="markah">0</b> / <b id="jumlah">0</b></div>
  </div>

  <script>
    let a, b, markah = 0, jumlah = 0;

    function soalanBaru() {
      a = Math.floor(Math.random() * 12) + 1;
      b = Math.floor(Math.random() * 12) + 1;
      document.getElementById("soalan").textContent = a + " × " + b;
      document.getElementById("jawapan").value = "";
      document.getElementById("jawapan").focus();
    }

    function semak() {
      const input = document.getElementById("jawapan").value;
      if (input === "") return;
      const mesej = document.getElementById("mesej");
      jumlah++;
      if (Number(input) === a * b) {
        markah++;
        mesej.textContent = "✅ Betul! Hebat!";
        mesej.className = "mesej betul";
      } else {
        mesej.textContent = "❌ Jawapan: " + (a * b);
        mesej.className = "mesej salah";
      }
      document.getElementById("markah").textContent = markah;
      document.getElementById("jumlah").textContent = jumlah;
      soalanBaru();
    }

    document.getElementById("jawapan").addEventListener("keydown", e => {
      if (e.key === "Enter") semak();
    });

    soalanBaru();
  </script>
</body>
</html>
